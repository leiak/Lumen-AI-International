<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>国际物流系统 · 业务效果原型 RP</title>
<style>
:root{
  --nav:#1f2733; --nav2:#27313f; --accent:#2f6fed; --accent2:#20b8a6;
  --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --ink:#1b2430; --muted:#6b7686;
  --ok:#18a058; --warn:#e6a23c; --bad:#e25c5c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.layout{display:flex;min-height:100vh}
/* sidebar */
aside{width:248px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#cfd8e3;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px}
.brand .sub{font-size:11px;color:#8fa0b4;margin-top:4px}
.navsec{font-size:11px;color:#7c8ba0;letter-spacing:1px;padding:14px 18px 6px}
.navitem{padding:9px 18px;cursor:pointer;font-size:13.5px;color:#c3cfdd;border-left:3px solid transparent;transition:.15s}
.navitem:hover{background:rgba(255,255,255,.05);color:#fff}
.navitem.active{background:rgba(47,111,237,.18);color:#fff;border-left-color:var(--accent)}
.navitem .tag{float:right;font-size:10px;opacity:.7;margin-top:2px}
/* main */
main{flex:1;padding:22px 26px;overflow:visible}
.page{display:none}
.page.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pagehead h1{margin:0;font-size:22px}
.badge{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:3px 10px}
.tagline{color:var(--muted);margin:0 0 18px;max-width:860px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sec{width:4px;height:16px;background:var(--accent);border-radius:2px;display:inline-block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.muted{color:var(--muted)}
.chip{display:inline-block;background:#eef3fd;color:#254e9e;border-radius:6px;font-size:11.5px;padding:2px 8px;margin:2px 3px 2px 0}
.chip.ep{background:#e6f7f3;color:#0d7a6a}
.chip.evt{background:#fdf0e6;color:#a7681a}
/* state machine */
.sm{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sbox{background:#eef3fd;border:1px solid #c9d8f6;color:#254e9e;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.sbox.done{background:var(--ok);border-color:var(--ok);color:#fff}
.sbox.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.18)}
.sbox.branch{background:#fdf3e6;border-color:#f1d9b0;color:#a7681a}
.arrow{color:#b7c2d3;font-size:15px}
/* steps */
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:6px 0 6px 26px;border-bottom:1px dashed var(--line)}
.steps li:before{content:"";position:absolute;left:6px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--accent2)}
.steps li:last-child{border-bottom:none}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#f2f5fa;text-align:left;padding:7px 10px;color:var(--muted);font-weight:600}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-family:Consolas,monospace;white-space:nowrap;color:#254e9e}
/* dashboard */
.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;border-top:3px solid var(--accent)}
.pcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,30,50,.1)}
.pcard .num{font-size:26px;font-weight:700;color:var(--accent)}
.pcard .lb{color:var(--muted);font-size:12px;margin-top:4px}
.pill{display:inline-block;padding:4px 12px;border-radius:8px;font-size:12px;background:#fff;border:1px solid var(--line);margin:4px;cursor:pointer}
.pill.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.pill.ind{background:var(--accent2);color:#fff;border-color:var(--accent2)}
/* milestones */
.milestones{display:flex;flex-wrap:wrap;gap:10px}
.mile{flex:1 1 180px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.mile .code{font-weight:700;color:var(--accent);font-size:12px}
.mile .nm{font-weight:600;margin-top:2px}
.mile .via{color:var(--muted);font-size:11px;margin-top:4px}
.mile.on{border-color:var(--accent);border-width:2px}
.mile.arr{border-color:var(--ok)}
/* demo status board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.bcell{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:12px}
.bcell .k{font-size:11.5px;color:var(--muted)}
.bcell .v{font-weight:700;margin-top:4px;font-size:14px;min-height:20px}
.bcell .v.up{color:var(--ok)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.statbar{margin-top:10px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.statbar>span{display:block;height:100%;background:var(--accent);width:0;transition:.4s}
kbd{font-family:Consolas,monospace;background:#eef1f6;border:1px solid #d8dee8;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px}
.foot{color:var(--muted);font-size:11.5px;margin-top:20px}
.note{background:#fffbe8;border:1px solid #f4e6b8;color:#8a6d1f;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:14px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#c3cdd9;border-radius:6px}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><div class="logo">📦 International Logistics</div><div class="sub">国际物流系统 · 业务效果原型 v4.0 / RP</div></div>
    <div class="navsec">总览</div>
    <div class="navitem" data-p="dash">仪表盘总览</div>
    <div class="navitem" data-p="chain">全局主链路 · 交互演示</div>
    <div class="navitem" data-p="sys">系统能力 · 底座</div>
    <div class="navsec">业务模块</div>
    <div class="navitem" data-p="master"><span>基础资料</span><span class="tag">EP12</span></div>
    <div class="navitem" data-p="quotation"><span>询价报价</span><span class="tag">EP1</span></div>
    <div class="navitem" data-p="order"><span>委托单</span><span class="tag">EP2</span></div>
    <div class="navitem" data-p="booking"><span>订舱操作</span><span class="tag">EP3/4</span></div>
    <div class="navitem" data-p="tracking"><span>跟踪异常</span><span class="tag">EP5</span></div>
    <div class="navitem" data-p="customs"><span>报关关务</span><span class="tag">EP6</span></div>
    <div class="navitem" data-p="wms"><span>仓储 WMS</span><span class="tag">EP7</span></div>
    <div class="navitem" data-p="finance"><span>财务结算</span><span class="tag">EP8/9</span></div>
    <div class="navitem" data-p="crm"><span>CRM / 客服</span><span class="tag">EP11</span></div>
    <div class="navitem" data-p="notification"><span>通知系统</span><span class="tag">EP10</span></div>
    <div class="navitem" data-p="delivery"><span>配送调度</span><span class="tag">EP-D</span></div>
    <div class="navitem" data-p="reverse"><span>逆向物流</span><span class="tag">EP-R</span></div>
    <div class="navitem" data-p="planning"><span>需求预测</span><span class="tag">EP-F</span></div>
    <div class="navitem" data-p="procurement"><span>采购供应</span><span class="tag">EP-P</span></div>
    <div class="navitem" data-p="transship"><span>装卸换装转运</span><span class="tag">EP-T</span></div>
    <div class="navsec">设计文档</div>
    <div class="navitem" onclick="window.open('../README.md')">README 文档总览</div>
  </aside>
  <main>
    <div class="page head" id="p-head"><div class="pagehead"><h1>—</h1><span class="badge">—</span></div><p class="tagline">—</p></div>
    <div id="content"></div>
  </main>
</div>

<script>
/* ============ 数据模型 ============ */
const EP = {master:'EP-12',quotation:'EP-1',order:'EP-2',booking:'EP-3/EP-4',tracking:'EP-5',customs:'EP-6',wms:'EP-7',finance:'EP-8/EP-9',crm:'EP-11',notification:'EP-10'};
const modules={
master:{key:'master',title:'基础资料',code:'Master Data',ep:'EP-12',tag:'主数据治理',desc:'客户、合作方、港口、HS、仓库、币种等主数据的唯一性与生命周期治理，是全部业务单据的地基。',
 roles:['销售','关务','平台管理员','财务'],
 states:['草稿','待审核','生效','冻结','停用','作废'],
 steps:['建立档案（筛选唯一性校验）','提交审核（大客户/合作方启用需审批）','生效并广播到各业务模块','资质到期/欠款/绩效触发冻结','合规停用，保留历史引用','作废归档，全链只读'],
 tables:['t_customer(+lifecycle_status)','t_partner(+绩效/资质)','t_port/t_hs_code(版本化)','t_warehouse(+容量/温控)','t_md_change_log','t_extension_field'],
 events:['md.activated','md.frozen','customer.merged','hs.updated','port.closed'],
 eps:['唯一性/合并映射','评级与授信初始化','冻结/停用影响评估','字典与扩展字段'],
 kpis:['主数据完整率','审核/生效时效','重复档案合并率','废止引用风险']},
quotation:{key:'quotation',title:'询价报价',code:'Quotation',ep:'EP-1',tag:'营销入口',desc:'询价→报价→转委托，报价计算引擎依运价、附加费、协议价与汇率生成，毛利护栏与审批兜底。',
 roles:['客户','销售','主管(审批)'],
 states:['待分配','已分配','报价中','已报价','已采纳','已过期','已拒绝','已关闭'],
 steps:['客户在线/销售录入询价','自动/手动分配销售并启动SLA','调用报价引擎试算(EP-1)','提交审核（毛利护栏）','发送报价（锁价锁汇率）','采纳→转委托单（复用费用）','过期/拒绝→关闭归档'],
 tables:['t_inquiry(+SLA字段)','t_quotation(+approval/lock)','t_quotation_item','t_base_rate','t_surcharge'],
 events:['quotation.issued','quotation.accepted','quotation.rejected','inquiry.expired','fx.locked'],
 eps:['计算前/后钩子','自动报价开关','毛利护栏与审批路由','报价模板定制'],
 kpis:['询价响应时效','报价命中率','询价转化率','报价毛利率']},
order:{key:'order',title:'委托单',code:'Order',ep:'EP-2',tag:'合同主干',desc:'合同级主干单据，15 态覆盖询报价到关账全生命周期，驱动订舱、操作、报关、财务、跟踪闭环。',
 roles:['客户','销售','操作','财务'],
 states:['草稿','待确认','已确认','已订舱','已操作','已发运','在途','已到港','清关中','已派送','已签收','已结算','已关账','已取消','已作废'],
 steps:['创建（引用报价/商机/扩展）','提交→待确认（校验信用/危险品/HS）','客户确认（锁价锁汇率）','下订舱→已订舱','操作/报关→已发运','跟踪推进→签收','费用闭环→结算→关账'],
 tables:['t_order(+15态/锁价/来源)','t_order_cargo','t_order_service_item','t_order_segment(多式联运)'],
 events:['order.submitted','order.confirmed','order.settled','order.closed','milestone.reached'],
 eps:['校验(信用/风控/合规)','费用联动','多式联运段扩展','通知策略'],
 kpis:['确认/订舱/全程时效','撤单/作废率','超SLA单','结算关账时效']},
booking:{key:'booking',title:'订舱操作',code:'Booking/Ops',ep:'EP-3/4',tag:'舱位与作业',desc:'订舱、提单、补料、集装箱四套状态机，多通道与承运人对接，截关/截港时限可控，特殊货物可扩展。',
 roles:['操作','财务','客户'],
 states:['待订','申请中','已订','已确认','已放舱','已截关','已装船','已退舱','已变更','已取消'],
 steps:['提交订舱（配额/危险品/合规）','EDI/API/邮件多通道外发','SO/舱位确认→委托单BOOKED','截关/截港/VGM时限管理','补料/监管申报/放行','装船→跟踪','退舱/变更走守卫审批'],
 tables:['t_booking(+截关/SO)','t_bill_of_lading(+release_mode)','t_shipping_instruction','t_container(10节点)'],
 events:['booking.confirmed','booking.cancelled','bl.issued','bl.released','container.*','booking.cutoff_passed'],
 eps:['订舱前校验(危险品/冷链/超大)','单证模板定制','渠道路由策略','放单门禁'],
 kpis:['订舱成功率/时效','截关准点率','放单时效','改单率']},
tracking:{key:'tracking',title:'跟踪异常',code:'Tracking',ep:'EP-5',tag:'可见与预警',desc:'多源事件归一化管道，映射里程碑推进委托单；ETA 生命周期与异常 SLA 升级，保障准点承诺。',
 roles:['操作','客服','客户(门户)'],
 states:['RAW→NORMALIZED→PUBLISHED','事件→里程碑映射','ETA:生成/刷新/失效/确认','异常:待处理→处理中→升级→[[转工单]]→已解决→已关闭→重开'],
 steps:['多源入站(EDI/API/GPS/邮件/手工)','归一化管道：清洗/转码/去重合并','映射里程碑→推进委托单状态','ETA 生成与刷新（置信/失效）','命中异常规则→建异常事件+工单','SLA 逐级升级→解决→回访→关闭'],
 tables:['t_tracking_event(+milestone/管道)','t_exception_event(+SLA/升级)','t_eta','t_milestone_instance'],
 events:['milestone.reached','eta.updated','exception.created','exception.escalated','ticket.created'],
 eps:['归一化管道','里程碑映射','异常识别规则','SLA 升级阶梯'],
 kpis:['跟踪完整率','跟踪时效P95','异常率','ETA准确率','SLA达成率']},
customs:{key:'customs',title:'报关关务',code:'Customs',ep:'EP-6',tag:'合规放行',desc:'HS 预归类、监管证件强校验前置；报关单 10 态，出口/进口双链路，单一窗口对接与查验缴税闭环。',
 roles:['关务','操作','财务'],
 states:['草稿','待申报','已申报','查验中','已放行','已结关','已退单','已退关','已作废'],
 steps:['创建报关单(HS/单证/货量)','预归类+监管证件+合规检查(EP-6)','提交单一窗口申报','放行/查验/退单回执处理','结关（离境/入境确认）','税费联动与缴税','退关/作废走审批'],
 tables:['t_customs_declaration(+预归类/合规)','t_customs_declaration_item','t_customs_document'],
 events:['customs.submitted','customs.released','customs.rejected','customs.inspected','customs.closed'],
 eps:['预归类与合规规则','单一窗口适配','查验协调','缴税与汇率'],
 kpis:['申报一次通过率','放行时效','查验率','预归类准确率']},
wms:{key:'wms',title:'仓储 WMS',code:'WMS',ep:'EP-7',tag:'库存与作业',desc:'入库/出库/库存/调拨/盘点五套作业状态机，波次与拣货策略，增值服务作业可扩展，联动成本结转。',
 roles:['仓储','财务'],
 states:['入库:待到货→部分到货→已到货→已上架→已关闭','出库:待拣货→拣货中→已复核→已打包→已发货→已签收','库存:正常/冻结/待检/过期/残损'],
 steps:['ASN预约→到货验收→质检→上架','出库指令→波次→拣货→复核称重→打包贴标→发运','效期/库龄/上下限预警','调拨/盘点/增值服务','库存变更→成本结转'],
 tables:['t_wms_inbound','t_wms_outbound','t_inventory','t_warehouse_location','t_wms_transfer/t_cycle_count/t_vas_task'],
 events:['inbound.stored','outbound.shipped','inventory.changed','inventory.frozen'],
 eps:['收放货前后钩子','上架/波次/拣货策略','增值服务作业模板','海外仓对接'],
 kpis:['出入库时效','库存准确率','效期损耗率','库容利用率']},
finance:{key:'finance',title:'财务结算',code:'Finance',ep:'EP-8/9',tag:'结案回款',desc:'应收/应付/收款/付款/对账五套状态机，事件驱动计费，汇率锁定与利润快照支撑关账与回款闭环。',
 roles:['财务','客户','主管'],
 states:['应收:草稿→已生成→已对账→已确认→已开票→收款→结清(含红冲/坏账)','应付:草稿→已对账→已确认→已收票→付款(含红冲/退回)','收款:待核→已核→已认领→已核销'],
 steps:['业务事件触发计费(委托/订舱/操作/报关/签收)','费用+汇率锁定生成应收/应付','对账→确认→开票/收票','收款/付款核销','利润快照与账龄','余额清零+审计→关账'],
 tables:['t_ar_invoice(+锁汇率/票据)','t_ap_invoice','t_payment_received/paid','t_statement','t_order_profit_snapshot'],
 events:['ar.issued','ar.allocated','pm.received','pay.paid','order.settled','fx.locked'],
 eps:['记账(价目/税/汇率)','核销冲抵策略','付款审批流','对账周期/利润口径'],
 kpis:['DSO/账龄','DPO','回款率','毛利率/客户利润','坏账率']},
crm:{key:'crm',title:'CRM / 客服',code:'CRM/CS',ep:'EP-11',tag:'获客与服务',desc:'商机漏斗、工单 SLA、分派升级、满意度闭环，支撑从获客到留存的端到端客户服务。',
 roles:['销售','客服','客户'],

function smBoxes(m){
  // 解析 [[分支]]
  const strs=Array.isArray(m.states)?m.states:[m.states];
  let html='';
  for(const line of strs){
    const parts=[]; const segs=line.split('→');
    for(const s0 of segs){ let md='sbox'; let txt=s0.trim(); if(txt.includes('[[')){txt=txt.replace(/\[\[/g,'').replace(/\]\]/g,'');md='sbox branch';} parts.push(`<span class="${md}">${txt}</span>`);}
    html+=parts.join('<span class="arrow">→</span>')+'<span style="width:100%"></span>';
  }
  return `<div class="sm">${html}</div>`;
}
function renderSM(m){return `<div class="card"><h3><span class="sec"></span>状态机</h3>${smBoxes(m)}</div>`}

}

/* 事件绑定 */
document.addEventListener('click',function(e){
  const n=e.target.closest('.navitem[data-p]'); if(n){goto(n.dataset.p);return;}
  if(e.target && e.target.id==='nextM'){ if(demoi<milestones.length-1){demoi++;renderMiles();renderStatus();} return;}
  if(e.target && e.target.id==='resetM'){demoi=-1;renderMiles();renderStatus();return;}
  const mile=e.target.closest('.mile'); if(mile){const idx=[].slice.call(mile.parentNode.children).indexOf(mile); demoi=idx; renderMiles(); renderStatus();}
});
/* boot */
goto('dash');
</script>
</body>
</html>
